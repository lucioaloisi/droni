<div id="ov"><h1>DRONE HUNTER AR</h1><p>5 droni ostili ti circondano. Muoviti nello spazio, inquadrali, centrali col mirino e tocca lo schermo per sparare. Alza il volume.</p><button id="go">AVVIA</button><p id="st" style="font-size:12px"></p></div>

<script>
const $=i=>document.getElementById(i),D=Math.PI/180;

}
function init(){

 {const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#dfeaf5');gr.addColorStop(.5,'#8a949c');gr.addColorStop(.52,'#4a5156');gr.addColorStop(1,'#1c2124');x.fillStyle=gr;x.fillRect(0,0,512,256);x.fillStyle='#fff';[[60,50,90,30],[230,30,110,26],[380,70,80,40],[470,40,60,24],[150,120,60,14]].forEach(r=>x.fillRect(...r));

 hx=$('hud').getContext('2d');addEventListener('resize',resize);resize();
 fetch('drone.glb').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(ab=>new THREE.GLTFLoader().parse(ab,'',g=>{model=g.scene;model.traverse(o=>{if(o.isMesh)o.material.envMapIntensity=1.3});const b=new THREE.Box3().setFromObject(model),s=new THREE.Vector3();b.getSize(s);model.scale.setScalar(.8/Math.max(s.x,s.y,s.z));
  const c=b.getCenter(new THREE.Vector3()).multiplyScalar(model.scale.x);const w=new THREE.Group();model.position.sub(c);w.add(model);model=w;spawn();started=true},e=>{window.merr='MODELLO drone.glb NON VALIDO'})).catch(e=>{window.merr='drone.glb NON TROVATO: METTILO ACCANTO A index.html'});
 let dx=0,dy=0,moved=0,t0=0;const el=$('hud');

function buildDrone(){

 [[.38,.09,0],[-.38,.09,0],[0,.09,.4],[0,.09,-.4]].forEach(([x,y,z],k)=>{const r=new THREE.Group();r.position.set(x,y,z);r.add(new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.05,12),dark));

function mkSnd(){
 if(!audio)return null;const o=audio.createOscillator(),o2=audio.createOscillator(),f=audio.createBiquadFilter(),am=audio.createGain(),g=audio.createGain(),p=audio.createStereoPanner(),l=audio.createOscillator(),lg=audio.createGain();
 o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=800;am.gain.value=.5;lg.gain.value=.5;g.gain.value=0;l.frequency.value=30;
 o.connect(f);o2.connect(f);f.connect(am);am.connect(g);g.connect(p);p.connect(audio.destination);l.connect(lg);lg.connect(am.gain);

}
function sndUpd(d,dist,v){const s=d.snd;if(!s)return;const n=audio.currentTime;

function shoot(){

const fx=[];

function boom(p){
 const A=THREE.AdditiveBlending,N=THREE.NormalBlending,gt=glowTex();
 fx.push({s:spr(gt,0xffffff,A,.4,p,1),v:new THREE.Vector3(),grow:5,life:.18,max:.18,op:1});

 for(let i=0;i<10;i++){const v=rnd().multiplyScalar(.3+Math.random()*.5);v.y+=.4;fx.push({s:spr(gt,0x2a2622,N,.3,p,.55),v,grow:1.2,life:1.2+Math.random()*.6,max:1.6,op:.55,smoke:1})}

 const n=70,a=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){a[i*3]=p.x;a[i*3+1]=p.y;a[i*3+2]=p.z;v.push(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(.8+Math.random()*2.2))}

 const m=new THREE.PointsMaterial({color:0xff9a2a,size:.1,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}),pts=new THREE.Points(g,m);scene.add(pts);

 for(let i=booms.length-1;i>=0;i--){const b=booms[i];b.life-=dt/.9;const pos=b.pts.geometry.attributes.position;
